<VirtualHost *:443>
    ServerName example.org
    ServerAlias example.com

    RewriteEngine on
    RewriteCond %{SERVER_NAME} !=example.org
    RewriteRule ^(.*) https://example.org$1 [R=301,L]

    <IfModule proxy_fcgi_module>
        <FilesMatch ".+\.ph(ar|p|tml)$">
            <If "-f %{SCRIPT_FILENAME}">
                SetHandler "proxy:unix:/var/run/php-fpm.sock|fcgi://localhost"
            </If>
        </FilesMatch>
    </IfModule>

    SSLEngine On
    SSLProtocol TLSv1.2
    SSLCertificateFile /etc/certs/example-apache.crt
    SSLCertificateKeyFile /etc/certs/example.key
    SSLCACertificateFile /etc/ca/non-standard-ca-name.crt
    SSLCARevocationCheck leaf
    SSLCARevocationFile /etc/ca/non-standard-ca-name.crl
    Header always set Strict-Transport-Security max-age=31536000

    <Directory /var/www/example.org/current/docroot/private>
        RewriteEngine on

        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
        RewriteRule ^ handler.php [L,QSA]

        # Only for authenticated: 
        SSLVerifyClient optional
        SSLVerifyDepth 1
        SSLOptions +ExportCertData
        Require ssl-verify-client
    </Directory>

    # expose some vendor files
    Alias /some /var/www/example.org/current/vendor/some/public

    SetEnv APP_ENDPOINT "https://foo.example.com"

    SSLProxyEngine On
    ProxyPreserveHost Off
    ProxyPass /blog https://blog.example.com
    ProxyPassReverse /blog https://blog.example.com

    AddDefaultCharset utf-8
</VirtualHost>
