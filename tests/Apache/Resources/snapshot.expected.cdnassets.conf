<VirtualHost *:443>
    ServerName assets.example.com
    ServerAdmin support@example.com

    SSLEngine On
    SSLCertificateFile /etc/certs/example-apache.crt
    SSLCertificateKeyFile /etc/certs/example.key
    SSLCACertificateFile /etc/ca/wonderproxy-ca.crt
    SSLCARevocationCheck leaf
    SSLCARevocationFile /etc/ca/wonderproxy-ca.crl
    Header always set Strict-Transport-Security max-age=31536000

    DocumentRoot /var/www/example.com/current/docroot
    <Directory /var/www/example.com/current/docroot>
        Require all granted

        RewriteEngine on

        # in comparison to the regular vhost rule, this does not have
        # the [L(ast)] flag, because we’d want to catch non-existent files
        # in the rule next to it
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
        RewriteRule ^(.*)\.\d+\.(js|css)$ $1.$2

        # Block requests to all non-files and any PHP scripts
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} !-f [or]
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} .php$
        RewriteRule ^ - [G,L]
    </Directory>

    CustomLog /var/log/apache2/assets.example.com_access-nofail.log combined
    LogLevel warn
    ErrorLog /var/log/apache2/assets.example.com_error-nofail.log

    ExpiresActive On

    ExpiresByType image/png "access plus 6 months"
    ExpiresByType image/svg+xml "access plus 6 months"
    ExpiresByType image/jpeg "access plus 6 months"
    ExpiresByType image/x-icon "access plus 6 months"
    ExpiresByType text/css "access plus 6 months"
    ExpiresByType font/ttf "access plus 6 months"
    ExpiresByType font/woff2 "access plus 6 months"
    ExpiresByType font/otf "access plus 6 months"
    ExpiresByType application/javascript "access plus 6 months"
    ExpiresByType application/font-sfnt "access plus 6 months"
    ExpiresByType application/font-woff "access plus 6 months"
    ExpiresByType application/font-woff2 "access plus 6 months"

    # No expires for dynamic files:
    ExpiresByType text/html "access plus 0 seconds"
    ExpiresByType application/json "access plus 0 seconds"
</VirtualHost>
