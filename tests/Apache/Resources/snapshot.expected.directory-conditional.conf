<VirtualHost *:80>
    ServerName example.com

    DocumentRoot /var/www/example.com/current/docroot
    <Directory /var/www/example.com/current/docroot>
        Require all granted

        DirectoryIndex index.php

        RewriteEngine on

        RewriteRule robots.txt /robots-true.txt [L]
    </Directory>
</VirtualHost>
