<VirtualHost *:443>
    ServerName testlocal.ly

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/testlocal.ly/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/testlocal.ly/privkey.pem
    SSLCACertificateFile /etc/ca/wonderproxy-ca.crt
    SSLCARevocationCheck leaf
    SSLCARevocationFile /etc/ca/wonderproxy-ca.crl
    Header always set Strict-Transport-Security max-age=31536000
</VirtualHost>

<VirtualHost *:443>
    ServerName staging-secure.testlocal.ly

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/staging.testlocal.ly/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.testlocal.ly/privkey.pem
    SSLCACertificateFile /etc/ca/wonderproxy-ca.crt
    SSLCARevocationCheck leaf
    SSLCARevocationFile /etc/ca/wonderproxy-ca.crl
    Header always set Strict-Transport-Security max-age=31536000
</VirtualHost>
