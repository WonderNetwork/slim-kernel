<VirtualHost *:80>
    ServerName example.com

    Header always set Content-Security-Policy \
        "default-src 'none'; \
        connect-src 'self' \
            https://plausible.io \
            https://api.friendlycaptcha.com \
            https://*.sentry.io \
            https://assets.example.com; \
        font-src 'self' \
            data:; \
        img-src 'self' \
            data: \
            https://assets.example.com; \
        object-src 'none'; \
        script-src 'self' \
            'wasm-unsafe-eval' \
            https://www.gstatic.com/; \
        style-src 'self' \
            'unsafe-inline' \
            https://www.gstatic.com/; \
        frame-ancestors 'none'; \
        form-action 'self'; \
        base-uri 'none'; \
        manifest-src 'self'; \
        child-src blob:; \
        frame-src https://*.frcapi.com;"
</VirtualHost>
