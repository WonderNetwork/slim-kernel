<VirtualHost *:443>
    ServerName secure.example.com

    SSLEngine On
    SSLCertificateFile /etc/certs/example-apache.crt
    SSLCertificateKeyFile /etc/certs/example.key
    SSLCACertificateFile /etc/ca/wonderproxy-ca.crt
    SSLCARevocationCheck leaf
    SSLCARevocationFile /etc/ca/wonderproxy-ca.crl
    Header always set Strict-Transport-Security max-age=31536000

    SSLVerifyClient require
    SSLVerifyDepth 1
    Require expr %{SSL_CLIENT_I_DN_O} == "WonderProxy, Inc"
</VirtualHost>
